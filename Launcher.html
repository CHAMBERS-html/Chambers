<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chambers Launcher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    #searchInput {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
    }
    .url-button {
      display: inline-block;
      background-color: #333;
      color: white;
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .url-button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <h1>Chambers Launcher</h1>

  <input type="text" id="searchInput" onkeyup="filterGames()" placeholder="Search for a game...">

  <div id="buttonContainer">
    <!-- Buttons will go here -->
  </div>

  <script>
    function openURLFromButton(button) {
      const url = button.getAttribute('data-url');
      window.open(url, '_blank');
    }

    function filterGames() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const buttons = document.querySelectorAll("#buttonContainer .url-button");
      buttons.forEach(btn => {
        const text = btn.textContent.toLowerCase();
        btn.style.display = text.includes(input) ? "" : "none";
      });
    }

    const games = [
      { name: "LAUNCH CHAMBERS", url: "https://tranquil-banoffee-eb6406.netlify.app/rebecca.html" },
      
       ];

    const container = document.getElementById("buttonContainer");
    games.forEach(game => {
      const btn = document.createElement("button");
      btn.className = "url-button";
      btn.setAttribute("data-url", game.url);
      btn.setAttribute("onclick", "openURLFromButton(this)");
      btn.textContent = game.name;
      container.appendChild(btn);
    });
  </script>

</body>
</html>
